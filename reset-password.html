<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5f0"><title>Reset password — Stagerang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#192821;--muted:#6f7972;--paper:#f7f5f0;--white:#fffefa;--line:#e8e5dc;--green:#b9ee73}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px 'DM Sans',sans-serif}.bar{height:76px;padding:0 max(22px,calc((100vw - 1120px)/2));display:flex;align-items:center;background:var(--white);border-bottom:1px solid var(--line)}.brand{display:flex;gap:9px;align-items:center;text-decoration:none;color:var(--ink);font:800 22px Manrope}.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--green)}main{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);padding:34px;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 65px #16271e12}h1{font:700 29px Manrope;letter-spacing:-1px;margin:0 0 9px}p{color:var(--muted);line-height:1.55;margin:0 0 22px}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700;color:#5e6a61}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.field input:focus{outline:2px solid #b9ee7380;border-color:#83a966}.button{width:100%;border:0;border-radius:999px;background:var(--ink);color:white;padding:14px;font:700 14px 'DM Sans';cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.notice{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#eff7e7;color:#405d32;font-size:13px;line-height:1.5}.notice.show{display:block}.back{display:inline-block;margin-top:18px;color:#405d32;font-weight:700;text-decoration:none;font-size:13px}
  </style>
</head>
<body><header class="bar"><a class="brand" href="index.html"><span class="logo">SR</span>Stagerang</a></header>
<main><section class="card"><h1>Reset your password</h1><p>Enter the email address for your Stagerang account. We’ll send a secure link to choose a new password.</p><form id="reset-form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><button class="button" type="submit">Send reset link</button></form><div class="notice" id="notice" role="status" aria-live="polite"></div><a class="back" href="index.html">← Back to log in</a></section></main>
<script src="/site/bmc-supabase.js"></script><script src="/site/password-reset.js"></script></body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f0">
<title>Notifications — Stagerang</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2b22;--muted:#788078;--paper:#f6f5f0;--white:#fffefa;--line:#e9e7df;--green:#b9ee73;--deep:#293d30}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px 'DM Sans',sans-serif}button{font:inherit;cursor:pointer}.collabry-nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;height:68px;padding:0 max(20px,calc((100vw - 1260px)/2));background:white;border-bottom:1px solid var(--line)}.collabry-logo{display:flex;align-items:center;gap:9px;min-width:150px;color:var(--ink);font:700 17px Manrope;text-decoration:none}.collabry-logo span{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#dff1e7;color:#32885a;font-size:19px}.collabry-nav nav{height:100%;display:flex;align-items:stretch;gap:4px}.collabry-nav nav a{position:relative;display:flex;min-width:76px;align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:5px 10px 3px;border-bottom:2px solid transparent;color:#5b665f;text-decoration:none;white-space:nowrap;font-size:12px}.collabry-nav nav a span{font-size:19px}.collabry-nav nav a.active{color:#287b4d;border-bottom-color:#3a9a62}.collabry-account{display:flex;align-items:center;gap:16px;margin-left:auto;white-space:nowrap;color:#47544a;font-size:12px}.collabry-account a{color:#59655d;text-decoration:none}.wrap{width:min(920px,calc(100% - 40px));margin:44px auto 80px}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;color:#71836a;font-size:11px;font-weight:700}.heading h1{margin:6px 0;font:700 clamp(28px,4vw,38px) Manrope;letter-spacing:-1.2px}.heading p{margin:0;color:var(--muted)}.count{padding:7px 11px;border-radius:20px;background:#e8f2e2;color:#376444;font-weight:700}.panel{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 12px 32px #2337280d}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:6px}.filters button,.mark-all,.mark-one,.load-more{min-height:40px;padding:0 14px;border:1px solid transparent;border-radius:10px;background:transparent;color:#66736a}.filters button[aria-pressed=true]{border-color:#e0e8d8;background:#f0f5eb;color:#315d3d;font-weight:700}.mark-all{color:#35764f;font-weight:700}.list{display:grid;gap:0}.notification{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:start;gap:12px;padding:18px;border-bottom:1px solid #efeee8}.notification:last-child{border:0}.notification.unread{background:#f4f8ef}.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#edf3e8;color:#4e774b;font-size:18px}.content{min-width:0}.content a{color:inherit;text-decoration:none}.content a:hover{text-decoration:underline;text-underline-offset:3px}.content b{display:block;font-weight:700}.content p{margin:5px 0;color:#68766c;line-height:1.5}.content time{color:#89938a;font-size:12px}.mark-one{border-color:var(--line);background:white;font-size:12px;white-space:nowrap}.empty,.loading,.error{padding:48px 20px;text-align:center;color:var(--muted)}.error{color:#a33}.load-wrap{display:flex;justify-content:center;padding:12px}.load-more{border-color:var(--line);background:white;font-weight:600}.load-more:disabled,.mark-one:disabled,.mark-all:disabled{opacity:.55;cursor:wait}.toast{position:fixed;z-index:50;bottom:22px;left:50%;transform:translate(-50%,12px);max-width:calc(100vw - 28px);padding:12px 18px;border-radius:12px;background:var(--deep);color:white;opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}:focus-visible{outline:3px solid #84b95e;outline-offset:2px}@media(max-width:720px){.collabry-nav{height:auto;min-height:64px;padding:7px 12px;gap:8px;flex-wrap:wrap}.collabry-logo{min-width:0;font-size:15px}.collabry-nav nav{order:3;width:100%;height:48px;justify-content:space-around}.collabry-nav nav a{min-width:0;flex:1;padding:4px 2px;font-size:10px}.collabry-account{gap:8px;font-size:11px}.wrap{width:calc(100% - 24px);margin:24px auto 90px}.heading{align-items:start}.heading p{font-size:13px}.toolbar{align-items:start;flex-direction:column}.filters{width:100%;overflow:auto}.filters button{flex:1;min-width:58px;padding:0 9px}.mark-all{align-self:flex-end}.notification{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:14px}.icon{width:34px;height:34px}.mark-one{grid-column:2;justify-self:start;min-height:34px}.count{font-size:12px}}
</style>
<link rel="stylesheet" href="/site/design-system.css"><script defer src="/site/design-system.js"></script></head>
<body>
<header class="collabry-nav"><a class="collabry-logo" href="feed.html"><span>SR</span>Stagerang</a><nav aria-label="Main navigation"><a href="feed.html"><span>⌂</span><small>Home</small></a><a href="projects.html"><span>▤</span><small>Projects</small></a><a href="explore.html"><span>⌕</span><small>Explore</small></a><a href="dashboard.html"><span>▦</span><small>Dashboard</small></a><a href="messages.html"><span>✉</span><small>Messages</small></a><a class="active" href="notifications.html" data-notifications-link aria-current="page"><span>♧</span><small>Notifications</small></a></nav><div class="collabry-account"><span>My account</span><a href="logout.html">Log out</a></div></header>
<main class="wrap"><div class="heading"><div><div class="eyebrow">Your activity</div><h1>Notifications</h1><p>Project interest, messages, and connection updates appear here.</p></div><span class="count" id="unread-count" aria-live="polite">— unread</span></div><section class="panel" aria-label="Notification center"><div class="toolbar"><div class="filters" role="group" aria-label="Filter notifications"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="unread" aria-pressed="false">Unread</button><button type="button" data-filter="read" aria-pressed="false">Read</button></div><button class="mark-all" type="button" id="mark-all">Mark all as read</button></div><div class="list" id="notification-list" aria-live="polite"><div class="loading">Loading your notifications…</div></div><div class="load-wrap" id="load-wrap" hidden><button type="button" class="load-more" id="load-more">Load more</button></div></section></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/site/bmc-supabase.js"></script><script src="/site/bmc-app.js"></script><script src="/site/notifications-live.js"></script>
</body></html>
